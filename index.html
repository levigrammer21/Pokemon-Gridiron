<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07121d">
    <meta name="description" content="Open ten starter boxes, collect and develop all 898 Pokémon, and climb a persistent 25-team promotion and relegation pyramid—or play the six-team random draft.">
    <title>Pokémon Gridiron</title>
    <link rel="icon" type="image/png" href="pokemon-gridiron-logo.png">
    <link rel="apple-touch-icon" href="pokemon-gridiron-logo.png">
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <link rel="stylesheet" href="game.css">
    <script defer src="pokemon-data.js"></script>
    <script defer src="game.js"></script>
  </head>
  <body>
    <div class="stadium-lights" aria-hidden="true"></div>
    <header class="app-header">
      <button class="brand" id="brandHome" aria-label="Return to headquarters">
        <img class="brand-logo" src="pokemon-gridiron-logo.png" alt="">
          <span><strong>GRIDIRON</strong><small>NATIONAL LEAGUE</small></span>
      </button>
      <div class="header-center" id="headerCenter">
        <span class="live-dot"></span>
        <span>GRIDIRON ASSOCIATION</span>
      </div>
      <nav class="header-actions" aria-label="Application controls">
        <button class="icon-button player-search-button" data-action="player-directory" aria-label="Find a player profile" title="Find a player profile"><span aria-hidden="true">⌕</span><b>Players</b></button>
        <button class="icon-button" id="soundToggle" aria-label="Toggle sound" title="Toggle sound">♪</button>
        <button class="quiet-button" id="newGameButton">New Draft</button>
        <span class="version">v4.0.0</span>
      </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <div class="modal-shell hidden" id="modalShell" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-backdrop" data-close-modal aria-label="Close dialog"></button>
      <section class="modal-card" id="modalContent"></section>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <noscript>
      <div class="noscript">Pokémon Gridiron requires JavaScript to run Franchise, the draft, and the live simulation.</div>
    </noscript>
  </body>
</html>
